<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiver Support AI - Customer Support Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 600px;
            overflow: hidden;
        }

        .chat-panel {
            display: flex;
            flex-direction: column;
            border-right: 1px solid #f0f0f0;
        }

        .analysis-panel {
            overflow-y: auto;
            background: #f9f9f9;
        }

        .header {
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            display: flex;
            gap: 10px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }

        .message.user .message-content {
            background: #667eea;
            color: white;
        }

        .message.assistant .message-content {
            background: #f0f0f0;
            color: #333;
        }

        .input-area {
            padding: 16px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            gap: 10px;
        }

        input[type="text"] {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            font-family: inherit;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            padding: 12px 24px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #764ba2;
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .analysis-header {
            padding: 16px;
            font-weight: 600;
            color: #333;
            border-bottom: 1px solid #e0e0e0;
        }

        .analysis-section {
            padding: 12px 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .analysis-label {
            font-weight: 600;
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .analysis-value {
            color: #333;
            font-size: 14px;
            line-height: 1.5;
        }

        .analysis-mode {
            display: inline-block;
            padding: 4px 8px;
            background: #f0f0f0;
            border-radius: 4px;
            font-size: 12px;
            color: #666;
            margin-left: 6px;
        }

        .analysis-mode.heuristic {
            background: #ffeaa7;
            color: #d63031;
        }

        .analysis-mode.supervised {
            background: #a8e6cf;
            color: #27ae60;
        }

        .signals {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
            margin-top: 6px;
        }

        .signal-tag {
            display: inline-block;
            padding: 3px 8px;
            background: #e0e0e0;
            border-radius: 4px;
            font-size: 11px;
            color: #555;
        }

        .confidence {
            font-size: 13px;
            color: #667eea;
            font-weight: 600;
        }

        .escalation-yes {
            color: #d63031;
            font-weight: 600;
        }

        .escalation-no {
            color: #27ae60;
            font-weight: 600;
        }

        .response-source {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 4px;
            font-size: 12px;
            margin-top: 6px;
            color: #666;
        }

        .loading {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .loading span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: pulse 1.4s infinite;
        }

        .loading span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes pulse {
            0%, 60%, 100% {
                opacity: 0.3;
            }
            30% {
                opacity: 1;
            }
        }

        .examples-section {
            padding: 16px;
            border-bottom: 1px solid #e0e0e0;
        }

        .examples-label {
            font-weight: 600;
            color: #667eea;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }

        .example-btn {
            display: block;
            width: 100%;
            padding: 8px;
            margin: 4px 0;
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 4px;
            text-align: left;
            font-size: 12px;
            color: #333;
            cursor: pointer;
            transition: all 0.2s;
        }

        .example-btn:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }

        .error-message {
            background: #ffe0e0;
            color: #d63031;
            padding: 12px;
            border-radius: 4px;
            margin: 10px 0;
        }

        .health-status {
            padding: 12px 16px;
            font-size: 11px;
            color: #999;
            border-top: 1px solid #e0e0e0;
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
        }

        .status-dot.available {
            background: #27ae60;
        }

        .status-dot.unavailable {
            background: #e0e0e0;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
                height: auto;
            }

            .chat-panel {
                border-right: none;
                border-bottom: 1px solid #f0f0f0;
            }

            .analysis-panel {
                max-height: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Chat Panel -->
        <div class="chat-panel">
            <div class="header">
                <h1>🤖 Hiver Support AI</h1>
                <p>AI-assisted customer support</p>
            </div>

            <div class="messages" id="messages"></div>

            <div class="input-area">
                <input
                    type="text"
                    id="userInput"
                    placeholder="Type your support question..."
                    autocomplete="off"
                >
                <button id="sendBtn" onclick="sendMessage()">Send</button>
            </div>
        </div>

        <!-- Analysis Panel -->
        <div class="analysis-panel">
            <div class="analysis-header">AI Analysis</div>

            <div id="analysisContent">
                <div class="analysis-section">
                    <p style="color: #999; font-size: 12px;">
                        Start by typing a support message to see analysis.
                    </p>
                </div>

                <div class="examples-section">
                    <div class="examples-label">Example Queries</div>
                    <div id="examplesContainer"></div>
                </div>

                <div class="health-status" id="healthStatus"></div>
            </div>
        </div>
    </div>

    <script>
        let conversationHistory = [];

        // Initialize
        document.addEventListener('DOMContentLoaded', async () => {
            document.getElementById('userInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    sendMessage();
                }
            });

            // Load examples
            await loadExamples();

            // Check health
            await checkHealth();
        });

        async function loadExamples() {
            try {
                const response = await fetch('/api/examples');
                const examples = await response.json();

                const container = document.getElementById('examplesContainer');
                container.innerHTML = '';

                examples.slice(0, 6).forEach(ex => {
                    const btn = document.createElement('button');
                    btn.className = 'example-btn';
                    btn.textContent = ex.query;
                    btn.onclick = () => {
                        document.getElementById('userInput').value = ex.query;
                        document.getElementById('userInput').focus();
                    };
                    container.appendChild(btn);
                });
            } catch (e) {
                console.error('Failed to load examples:', e);
            }
        }

        async function checkHealth() {
            try {
                const response = await fetch('/api/health');
                const health = await response.json();

                const statusDiv = document.getElementById('healthStatus');
                let html = '<strong>Services:</strong><br>';

                for (const [component, status] of Object.entries(health.components)) {
                    const dotClass = status === 'available' ? 'available' : 'unavailable';
                    const label = component.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase());
                    html += `<span class="status-dot ${dotClass}"></span> ${label}<br>`;
                }

                statusDiv.innerHTML = html;
            } catch (e) {
                console.error('Failed to check health:', e);
            }
        }

        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (!message) {
                return;
            }

            // Add user message to UI
            addMessageToUI(message, 'user');
            input.value = '';

            // Show loading
            showLoading();

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message })
                });

                const data = await response.json();

                if (data.status === 'success') {
                    const result = data.result;

                    // Add assistant message
                    addMessageToUI(result.analysis.response.text, 'assistant');

                    // Update analysis
                    updateAnalysis(result);

                    // Store in history
                    conversationHistory.push({
                        user: message,
                        assistant: result.analysis.response.text,
                        analysis: result.analysis
                    });
                } else {
                    addMessageToUI('Sorry, an error occurred. Please try again.', 'assistant');
                    console.error('API error:', data.error);
                }
            } catch (error) {
                addMessageToUI('Connection error. Please check the server and try again.', 'assistant');
                console.error('Fetch error:', error);
            }
        }

        function addMessageToUI(text, role) {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;

            messageDiv.appendChild(content);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function showLoading() {
            const messagesDiv = document.getElementById('messages');
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'loadingMessage';

            const content = document.createElement('div');
            content.className = 'message-content';
            content.innerHTML = '<div class="loading"><span></span><span></span><span></span></div>';

            messageDiv.appendChild(content);
            messagesDiv.appendChild(messageDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function removeLoading() {
            const loading = document.getElementById('loadingMessage');
            if (loading) {
                loading.remove();
            }
        }

        function updateAnalysis(result) {
            removeLoading();

            const analysis = result.analysis;
            let html = '';

            // Intent
            const intent = analysis.intent;
            const intentMode = `<span class="analysis-mode ${intent.mode}">${intent.mode}</span>`;
            const confidence = intent.confidence ? ` <span class="confidence">${(intent.confidence * 100).toFixed(0)}%</span>` : '';
            html += `
                <div class="analysis-section">
                    <div class="analysis-label">Intent</div>
                    <div class="analysis-value">${intent.label}${intentMode}${confidence}</div>
            `;
            if (intent.signals && intent.signals.length > 0) {
                html += `<div class="signals">`;
                intent.signals.forEach(sig => {
                    html += `<span class="signal-tag">${sig}</span>`;
                });
                html += `</div>`;
            }
            html += `</div>`;

            // Escalation
            const escalation = analysis.escalation;
            const escalationClass = escalation.required ? 'escalation-yes' : 'escalation-no';
            const escalationText = escalation.required ? 'YES' : 'NO';
            html += `
                <div class="analysis-section">
                    <div class="analysis-label">Escalation</div>
                    <div class="analysis-value"><span class="${escalationClass}">${escalationText}</span></div>
            `;
            if (escalation.signals && escalation.signals.length > 0) {
                html += `<div class="signals">`;
                escalation.signals.forEach(sig => {
                    html += `<span class="signal-tag">${sig}</span>`;
                });
                html += `</div>`;
            }
            html += `</div>`;

            // Response Source
            const response = analysis.response;
            html += `
                <div class="analysis-section">
                    <div class="analysis-label">Response Source</div>
                    <div class="analysis-value">${response.source}</div>
                    <div class="response-source">${response.reasoning}</div>
            `;

            // Historical sources
            if (response.sources && response.sources.length > 0) {
                html += `<div style="margin-top: 8px; font-size: 11px; color: #999;">`;
                html += `${response.sources.length} historical response(s) used`;
                html += `</div>`;
            }

            html += `</div>`;

            // Retrieval
            const retrieval = analysis.retrieval;
            html += `
                <div class="analysis-section">
                    <div class="analysis-label">Retrieval</div>
                    <div class="analysis-value">${retrieval.status} (${retrieval.count} match${retrieval.count !== 1 ? 'es' : ''})</div>
                </div>
            `;

            // Recommendation
            const rec = result.recommendation;
            html += `
                <div class="analysis-section">
                    <div class="analysis-label">Recommendation</div>
                    <div class="analysis-value"><strong>${rec.action.toUpperCase()}</strong></div>
                    <div style="font-size: 12px; color: #666; margin-top: 4px;">${rec.description}</div>
                </div>
            `;

            document.getElementById('analysisContent').innerHTML = html;
        }
    </script>
</body>
</html>
